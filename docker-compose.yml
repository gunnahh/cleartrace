services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleartrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleartrace}
      POSTGRES_DB: ${POSTGRES_DB:-cleartrace}
    ports:
      - '5432:5432'
    volumes:
      - cleartrace_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cleartrace} -d ${POSTGRES_DB:-cleartrace}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cleartrace}:${POSTGRES_PASSWORD:-cleartrace}@postgres:5432/${POSTGRES_DB:-cleartrace}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: ${API_PORT:-3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      ADDITIONAL_WEB_ORIGINS: ${ADDITIONAL_WEB_ORIGINS:-}
      UPLOAD_DIR: /app/apps/api/data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - '${API_PORT:-3001}:3001'
    volumes:
      - cleartrace_uploads:/app/apps/api/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  cleartrace_pg:
  cleartrace_uploads:
